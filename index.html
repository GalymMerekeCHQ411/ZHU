<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChemMaster Pro: Mendeleev Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <style>
        :root {
            --primary: #1a2a6c;
            --accent: #00d2ff;
            --success: #2ecc71;
            --danger: #e74c3c;
            --glass: rgba(255, 255, 255, 0.94);
            --bg-color: #f0f4f8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            background: var(--bg-color);
            background-image: radial-gradient(circle at 10% 20%, rgba(0, 210, 255, 0.05) 0%, transparent 50%),
                              radial-gradient(circle at 90% 80%, rgba(26, 42, 108, 0.05) 0%, transparent 50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--primary);
            overflow-x: hidden;
        }

        /* Навигация и кнопки */
        .lang-switcher {
            position: fixed; top: 20px; right: 20px; z-index: 2000;
            background: white; padding: 8px 18px; border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex;
            gap: 10px; align-items: center; cursor: pointer;
            border: 2px solid var(--primary); font-weight: bold; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        nav {
            margin: 25px; display: flex; gap: 10px; padding: 10px;
            background: var(--glass); border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); backdrop-filter: blur(10px);
            position: sticky; top: 15px; z-index: 1000;
        }

        .nav-btn {
            border: none; padding: 12px 22px; border-radius: 40px;
            cursor: pointer; background: transparent; font-weight: 700;
            color: var(--primary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform, background;
        }

        .nav-btn.active { background: var(--primary); color: white; }
        .nav-btn:active { transform: scale(0.95); }

        /* Контейнеры с 60 FPS переходами */
        .container {
            display: none; width: 90%; max-width: 850px;
            background: var(--glass); padding: 40px; border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1); margin-bottom: 50px;
            /* Анимация появления */
            opacity: 0;
            transform: translate3d(0, 20px, 0);
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), 
                        transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: opacity, transform;
        }

        .active-page { 
            display: block; 
            opacity: 1; 
            transform: translate3d(0, 0, 0); 
        }

        /* pH Simulator Styles */
        .ph-grid { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 20px; margin-top: 20px; }
        .item-list { display: flex; flex-direction: column; gap: 12px; }
        .item-card {
            background: white; padding: 12px; border-radius: 15px;
            text-align: center; cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            will-change: transform;
        }
        .item-card:hover { transform: scale(1.03) translateY(-5px); border-color: var(--accent); }
        
        .ph-display { text-align: center; background: #fff; padding: 25px; border-radius: 25px; border: 1px solid #eee; }
        
        #ph-slider {
            width: 100%; height: 15px; border-radius: 10px; appearance: none;
            background: linear-gradient(to right, #ff0000, #ffa500, #ffff00, #008000, #00ffff, #0000ff, #800080);
            outline: none; margin: 25px 0; cursor: pointer;
        }
        #ph-slider::-webkit-slider-thumb {
            appearance: none; width: 26px; height: 26px; background: white; 
            border: 3px solid var(--primary); border-radius: 50%;
            transition: transform 0.1s ease;
        }

        .ph-value { 
            font-size: 54px; font-weight: 900; margin: 10px 0; 
            transition: color 0.4s linear; 
        }

        .ind-box { 
            padding: 10px; border-radius: 10px; color: white; font-size: 11px; width: 32%; 
            font-weight: bold; transition: background 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        .mendeleev-img { width: 220px; height: 280px; object-fit: cover; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); }
        .periodic-img { width: 100%; border-radius: 20px; margin-top: 25px; }

        input, select { padding: 15px; margin: 10px 0; border: 2px solid #e1e8f0; border-radius: 12px; width: 100%; box-sizing: border-box; transition: border-color 0.3s; }
        .btn-solve { background: var(--primary); color: white; border: none; padding: 18px; width: 100%; border-radius: 15px; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .btn-solve:hover { filter: brightness(1.2); transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="lang-switcher" onclick="toggleLang()">
        <span id="flag">🇰🇿</span> <span id="langName">Қазақша</span>
    </div>

    <nav>
        <button class="nav-btn active" onclick="showPage('home', this)">🏠 <span data-key="nav-home">Басты бет</span></button>
        <button class="nav-btn" onclick="showPage('ph-sim', this)">🌈 <span data-key="nav-ph">pH Орта</span></button>
        <button class="nav-btn" onclick="showPage('mass', this)">⚖️ <span data-key="nav-mass">Масса</span></button>
        <button class="nav-btn" onclick="showPage('rxn', this)">🧪 <span data-key="nav-rxn">Реакциялар</span></button>
        <button class="nav-btn" onclick="showPage('stoch', this)">📐 <span data-key="nav-stoch">Есептер</span></button>
        <button class="nav-btn" onclick="showPage('redox', this)">⚡ <span data-key="nav-redox">ТТБ</span></button>
    </nav>

    <div id="home" class="container active-page">
        <div style="text-align: center;">
            <h1 data-key="h-welcome">Химия әлеміне қош келдіңіз!</h1>
            <div class="mendeleev-card" style="display: flex; flex-direction: column; align-items: center; margin: 30px 0;">
                <img src="mendeleev.jpg" class="mendeleev-img" alt="Менделеев">
                <h2 data-key="m-name">Дмитрий Иванович Менделеев</h2>
            </div>
            <img src="table.png" class="periodic-img" alt="Кесте">
        </div>
    </div>

    <div id="ph-sim" class="container">
        <h2 style="text-align:center" data-key="ph-title">🌈 pH Интерактивті шкаласы</h2>
        <div class="ph-grid">
            <div class="item-list">
                <div class="item-card" onclick="animateSlider(2.0, 'lemon')">🍋 <span data-key="lemon">Лимон</span></div>
                <div class="item-card" onclick="animateSlider(7.0, 'water')">💧 <span data-key="water">Су</span></div>
            </div>
            <div class="ph-display">
                <div id="ph-status" style="font-weight:bold;">ОРТА: НЕЙТРАЛДЫ</div>
                <div class="ph-value" id="ph-num">7.0</div>
                <input type="range" id="ph-slider" min="0" max="14" step="0.1" value="7" oninput="manualPH(this.value)">
                <div style="display: flex; justify-content: space-around; margin-top: 20px;">
                    <div id="ind-lak" class="ind-box">ЛАКМУС</div>
                    <div id="ind-met" class="ind-box">МЕТИЛОРАНЖ</div>
                    <div id="ind-fen" class="ind-box">ФЕНОЛФТАЛЕИН</div>
                </div>
                <div id="ph-exp" style="margin-top: 15px; font-size: 14px;"></div>
            </div>
            <div class="item-list">
                <div class="item-card" onclick="animateSlider(14.0, 'naoh')">🔥 <span data-key="naoh">NaOH</span></div>
                <div class="item-card" onclick="animateSlider(0.0, 'hcl')">⚗️ <span data-key="hcl">HCl</span></div>
            </div>
        </div>
    </div>

    <div id="mass" class="container">
        <h2 data-key="mass-title">⚖️ Молярлық масса</h2>
        <input type="text" id="mIn" placeholder="H2SO4" oninput="calcM()">
        <div id="mRes" class="result">...</div>
    </div>

    <div id="rxn" class="container">
        <h2 data-key="rxn-title">🧪 Реакциялар</h2>
        <input type="text" id="rIn" placeholder="H2 + O2 = H2O">
        <button class="btn-solve" onclick="runBal()">Теңестіру</button>
        <div id="rRes" class="result">...</div>
    </div>

    <div id="stoch" class="container">
        <h2 data-key="stoch-title">📐 Есептер</h2>
        <input type="text" id="sEq" placeholder="Реакция">
        <button class="btn-solve" onclick="prepS()">Талдау</button>
        <div id="sUI" style="display:none; margin-top:20px;">
            <table id="sTab" style="width:100%"></table>
            <button class="btn-solve" onclick="solveS()">Есептеу</button>
        </div>
        <div id="sRes"></div>
    </div>

    <div id="redox" class="container">
        <h2 data-key="redox-title">⚡ ТТБ</h2>
        <input type="text" id="oIn" placeholder="KMnO4 + HCl = ...">
        <button class="btn-solve" onclick="runO()">Анықтау</button>
        <div id="oRes" class="result">...</div>
    </div>

    <script>
        const PT = {"H":1.008,"He":4.003,"Li":6.941,"Be":9.012,"B":10.81,"C":12.01,"N":14.01,"O":16,"F":19,"Ne":20.18,"Na":22.99,"Mg":24.31,"Al":26.98,"Si":28.09,"P":30.97,"S":32.06,"Cl":35.45,"Ar":39.95,"K":39.1,"Ca":40.08,"Sc":44.96,"Ti":47.87,"V":50.94,"Cr":52,"Mn":54.94,"Fe":55.85,"Co":58.93,"Ni":58.69,"Cu":63.55,"Zn":65.38,"Ga":69.72,"Ge":72.63,"As":74.92,"Se":78.96,"Br":79.9,"Kr":83.8,"Rb":85.47,"Sr":87.62,"Y":88.91,"Zr":91.22,"Nb":92.91,"Mo":95.94,"Ag":107.87,"Ba":137.33,"Pt":195.08,"Au":196.97,"Hg":200.59,"Pb":207.2};
        const FIXED_SOX = {"K":1,"Na":1,"Li":1,"Ag":1,"Ba":2,"Ca":2,"Mg":2,"Zn":2,"Al":3,"F":-1,"O":-2,"H":1};

        // Навигация 60 FPS
        function showPage(id, btn) {
            const current = document.querySelector('.container.active-page');
            const next = document.getElementById(id);
            if (current === next) return;

            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (current) {
                current.style.opacity = '0';
                current.style.transform = 'translate3d(0, -10px, 0)';
                setTimeout(() => {
                    current.classList.remove('active-page');
                    current.style.display = 'none';
                    next.style.display = 'block';
                    requestAnimationFrame(() => {
                        next.classList.add('active-page');
                    });
                }, 300);
            } else {
                next.style.display = 'block';
                requestAnimationFrame(() => next.classList.add('active-page'));
            }
        }

        // Анимация ползунка 60 FPS (requestAnimationFrame)
        function animateSlider(target, key) {
            const slider = document.getElementById('ph-slider');
            const start = parseFloat(slider.value);
            const dist = target - start;
            const duration = 600; 
            let startTime = null;

            function step(timestamp) {
                if (!startTime) startTime = timestamp;
                const progress = Math.min((timestamp - startTime) / duration, 1);
                const easedProgress = 1 - Math.pow(1 - progress, 3); // easeOutCubic
                
                const currentVal = start + (dist * easedProgress);
                slider.value = currentVal;
                manualPH(currentVal, false);

                if (progress < 1) {
                    requestAnimationFrame(step);
                }
            }
            requestAnimationFrame(step);
        }

        function manualPH(val, updateExp = true) {
            val = parseFloat(val);
            document.getElementById('ph-num').innerText = val.toFixed(1);
            
            let r, g, b;
            if(val < 7) { r = 255; g = Math.round(255 * val/7); b = 0; }
            else { r = Math.round(255 * (14-val)/7); g = Math.round(255 * (14-val)/7); b = 255; }
            
            document.getElementById('ph-num').style.color = `rgb(${r},${g},${b})`;
            document.getElementById('ind-lak').style.backgroundColor = val < 6 ? '#e74c3c' : (val > 8 ? '#3498db' : '#9b59b6');
            document.getElementById('ind-met').style.backgroundColor = val < 4 ? '#ff4d4d' : '#f1c40f';
            document.getElementById('ind-fen').style.backgroundColor = val < 9 ? '#bdc3c7' : '#e84393';
            
            let st = val < 6 ? 'ҚЫШҚЫЛДЫ' : (val <= 7.5 ? 'БЕЙТАРАП' : 'СІЛТІЛІК');
            document.getElementById('ph-status').innerText = 'ОРТА: ' + st;
        }

        // ВАША ОРИГИНАЛЬНАЯ ЛОГИКА (БЕЗ ИЗМЕНЕНИЙ)
        function parse(f) {
            let mult = (f.match(/^(\d+)/) || [1, 1])[1];
            let s = f.replace(/^\d+/, ''), i = 0;
            const p = () => {
                let d = {};
                while(i < s.length && s[i] !== ')') {
                    if(s[i] === '(') { i++; let n = p(); i++; let c = parseInt(s.slice(i).match(/^\d+/) || 1); 
                        for(let e in n) d[e] = (d[e]||0) + n[e]*c; i += (s.slice(i).match(/^\d+/) || [""])[0].length;
                    } else {
                        let m = s.slice(i).match(/^([A-Z][a-z]?)([0-9]*)/);
                        if(m) { d[m[1]] = (d[m[1]]||0) + parseInt(m[2] || 1); i += m[0].length; } else i++;
                    }
                } return d;
            };
            let res = p(); for(let e in res) res[e] *= mult; return res;
        }
        function getM(f) { let d = parse(f); return Object.entries(d).reduce((a, [e, c]) => a + (PT[e] || 0) * c, 0); }
        function calcM() { let v = document.getElementById('mIn').value; let m = getM(v); document.getElementById('mRes').innerHTML = m > 0 ? `<b>M(${v}) = ${m.toFixed(3)} г/моль</b>` : "..."; }
        
        function runBal() {
            let [l, r] = document.getElementById('rIn').value.replace(/\s+/g, '').split('=');
            let lhs = l.split('+'), rhs = r.split('+'), comps = [...lhs, ...rhs];
            let els = Array.from(new Set(comps.flatMap(c => Object.keys(parse(c)))));
            let matrix = els.map(e => comps.map((c, j) => (parse(c)[e] || 0) * (j < lhs.length ? 1 : -1)));
            matrix.push(comps.map((_, j) => j === 0 ? 1 : 0));
            let b = new Array(els.length).fill(0); b.push(1);
            let x = math.lusolve(matrix, b).map(v => Math.abs(v[0]));
            let f = 1; while(!x.every(v => Math.abs(Math.round(v*f) - v*f) < 0.001) && f < 100) f++;
            let res = x.map(v => Math.round(v*f));
            let oL = [], oR = [];
            res.forEach((c, i) => { let s = (c===1?'':c) + comps[i]; if(i < lhs.length) oL.push(s); else oR.push(s); });
            document.getElementById('rRes').innerHTML = `<b>${oL.join(' + ')} = ${oR.join(' + ')}</b>`;
        }

        function prepS() {
            let comps = document.getElementById('sEq').value.split(/[=+]/).map(s => s.trim());
            document.getElementById('sTab').innerHTML = '<tr>' + comps.map(c => `<th>${c}</th>`).join('') + '</tr>' +
                '<tr>' + comps.map((_, i) => `<td><input id="v${i}" style="width:60px"><br><select id="t${i}"><option value="m">г</option><option value="n">моль</option></select></td>`).join('') + '</tr>';
            document.getElementById('sUI').style.display = 'block';
        }

        function solveS() {
            let comps = document.getElementById('sEq').value.split(/[=+]/).map(s => s.trim());
            let coeffs = comps.map(c => parseInt(c.match(/^\d+/) || 1));
            let kI = -1; comps.forEach((_, i) => { if(document.getElementById('v'+i).value) kI = i; });
            let nk = parseFloat(document.getElementById('v'+kI).value) / (document.getElementById('t'+kI).value === 'm' ? getM(comps[kI].replace(/^\d+/, '')) : 1);
            let n1 = nk / coeffs[kI];
            let html = "";
            comps.forEach((c, i) => {
                if(i !== kI) {
                    let tN = n1 * coeffs[i];
                    let res = document.getElementById('t'+i).value === 'm' ? (tN * getM(c.replace(/^\d+/, ''))).toFixed(2) + ' г' : tN.toFixed(3) + ' моль';
                    html += `<div class="result"><b>${c}:</b> ${res}</div>`;
                }
            });
            document.getElementById('sRes').innerHTML = html;
        }

        function runO() {
            let [l, r] = document.getElementById('oIn').value.replace(/\s+/g, '').split('=');
            const getSO = (f) => {
                let d = parse(f), ks = Object.keys(d); if(ks.length === 1) return {[ks[0]]: 0};
                let res = {}, sum = 0, unk = '';
                ks.forEach(k => { if(FIXED_SOX[k]) { res[k]=FIXED_SOX[k]; sum+=res[k]*d[k]; } else unk=k; });
                if(unk) res[unk] = -sum/d[unk]; return res;
            };
            let lS = {}, rS = {};
            l.split('+').forEach(c => { let m = getSO(c); for(let e in m) { if(!lS[e]) lS[e]=new Set(); lS[e].add(Math.round(m[e])); }});
            r.split('+').forEach(c => { let m = getSO(c); for(let e in m) { if(!rS[e]) rS[e]=new Set(); rS[e].add(Math.round(m[e])); }});
            let h = "";
            Object.keys(lS).forEach(e => {
                if(rS[e]) { lS[e].forEach(s1 => { rS[e].forEach(s2 => {
                    if(s1 !== s2) h += `<div><b>${e}</b>: ${s1} -> ${s2}</div>`;
                })})}
            });
            document.getElementById('oRes').innerHTML = h || "Өзгеріс жоқ";
        }

        window.onload = () => manualPH(7);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChemMaster Pro: Mendeleev Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <style>
        :root {
            --primary: #1a2a6c;
            --accent: #00d2ff;
            --success: #2ecc71;
            --danger: #e74c3c;
            --glass: rgba(255, 255, 255, 0.94);
            --bg-color: #f0f4f8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            background: var(--bg-color);
            background-image: radial-gradient(circle at 10% 20%, rgba(0, 210, 255, 0.05) 0%, transparent 50%),
                              radial-gradient(circle at 90% 80%, rgba(26, 42, 108, 0.05) 0%, transparent 50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--primary);
            overflow-x: hidden;
        }

        .lang-switcher {
            position: fixed; top: 20px; right: 20px; z-index: 2000;
            background: white; padding: 8px 18px; border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex;
            gap: 10px; align-items: center; cursor: pointer;
            border: 2px solid var(--primary); font-weight: bold; transition: 0.3s;
        }

        nav {
            margin: 25px; display: flex; gap: 10px; padding: 10px;
            background: var(--glass); border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); backdrop-filter: blur(10px);
            position: sticky; top: 15px; z-index: 1000;
        }

        .nav-btn {
            border: none; padding: 12px 22px; border-radius: 40px;
            cursor: pointer; background: transparent; font-weight: 700;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); color: var(--primary);
        }

        .nav-btn.active { background: var(--primary); color: white; }

        .container {
            display: none; 
            width: 90%; max-width: 850px;
            background: var(--glass); padding: 40px; border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1); margin-bottom: 50px;
            opacity: 0;
            transform: translateY(20px) scale(0.98);
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), 
                        transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform, opacity;
        }

        .active-page { display: block; opacity: 1; transform: translateY(0) scale(1); }

        /* pH Styles */
        .ph-grid { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 20px; margin-top: 20px; }
        .item-list { display: flex; flex-direction: column; gap: 12px; }
        .item-card {
            background: white; padding: 12px; border-radius: 15px;
            text-align: center; cursor: pointer; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .item-card:hover { transform: translateY(-3px); border-color: var(--accent); }
        .ph-display { text-align: center; background: #fff; padding: 25px; border-radius: 25px; border: 1px solid #eee; }
        #ph-slider { width: 100%; height: 15px; border-radius: 10px; appearance: none; background: linear-gradient(to right, #ff0000, #ffa500, #ffff00, #008000, #00ffff, #0000ff, #800080); outline: none; margin: 25px 0; }
        .ph-value { font-size: 54px; font-weight: 900; margin: 10px 0; }
        .indicator-row { display: flex; justify-content: space-around; gap: 8px; margin-top: 25px; }
        .ind-box { padding: 10px; border-radius: 10px; color: white; font-size: 11px; width: 32%; font-weight: bold; }

        /* Results */
        .result { margin-top: 25px; padding: 25px; background: white; border-radius: 20px; border-left: 8px solid var(--accent); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        input { padding: 15px; margin: 10px 0; border: 2px solid #e1e8f0; border-radius: 12px; font-size: 16px; width: 100%; box-sizing: border-box; }
        .btn-solve { background: var(--primary); color: white; border: none; padding: 18px; width: 100%; border-radius: 15px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; }

        /* Composition Bars */
        .comp-row { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; padding: 8px; background: #f0f7ff; border-radius: 10px; }
        .comp-bar-bg { flex-grow: 1; height: 8px; background: #e1e8f0; margin: 0 15px; border-radius: 4px; overflow: hidden; }
        .comp-bar-fill { height: 100%; background: var(--accent); transition: width 0.6s ease; }
        
        /* Rxn Info Styling */
        .rxn-type-badge { display: inline-block; padding: 5px 15px; border-radius: 20px; background: var(--primary); color: white; font-weight: bold; margin-bottom: 10px; }
        .rxn-desc { font-size: 14px; color: #555; line-height: 1.4; border-top: 1px solid #eee; pt: 10px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="lang-switcher" onclick="toggleLang()">
        <span id="flag">🇰🇿</span> <span id="langName">Қазақша</span>
    </div>

    <nav>
        <button class="nav-btn active" onclick="showPage('home', this)">🏠 <span data-key="nav-home">Басты бет</span></button>
        <button class="nav-btn" onclick="showPage('ph-sim', this)">🌈 <span data-key="nav-ph">pH Орта</span></button>
        <button class="nav-btn" onclick="showPage('mass', this)">⚖️ <span data-key="nav-mass">Масса және құрам</span></button>
        <button class="nav-btn" onclick="showPage('rxn', this)">🧪 <span data-key="nav-rxn">Реакциялар</span></button>
        <button class="nav-btn" onclick="showPage('stoch', this)">📐 <span data-key="nav-stoch">Есептер</span></button>
        <button class="nav-btn" onclick="showPage('redox', this)">⚡ <span data-key="nav-redox">ТТБ</span></button>
    </nav>

    <div id="home" class="container active-page">
        <div class="home-content" style="text-align:center">
            <h1 data-key="h-welcome">Химия әлеміне қош келдіңіз!</h1>
            <img src="mendeleev.jpg" style="width:200px; border-radius:20px; margin:20px" alt="Mendeleev">
            <h2 data-key="m-name">Дмитрий Иванович Менделеев</h2>
            <img src="table.png" style="width:100%; border-radius:20px; margin-top:20px" alt="Table">
        </div>
    </div>

    <div id="ph-sim" class="container">
        <h2 style="text-align:center" data-key="ph-title">🌈 pH Интерактивті шкаласы</h2>
        <div class="ph-grid">
            <div class="item-list">
                <div class="item-card" onclick="updatePH(2.0, 'lemon')">🍋 <span data-key="lemon">Лимон</span></div>
                <div class="item-card" onclick="updatePH(7.0, 'water')">💧 <span data-key="water">Су</span></div>
            </div>
            <div class="ph-display">
                <div id="ph-status" style="font-weight:bold;">ОРТА: НЕЙТРАЛДЫ</div>
                <div class="ph-value" id="ph-num">7.0</div>
                <input type="range" id="ph-slider" min="0" max="14" step="0.1" value="7" oninput="manualPH(this.value)">
                <div class="indicator-row">
                    <div id="ind-lak" class="ind-box">ЛАКМУС</div>
                    <div id="ind-met" class="ind-box">МЕТИЛОРАНЖ</div>
                    <div id="ind-fen" class="ind-box">ФЕНОЛФТАЛЕИН</div>
                </div>
            </div>
            <div class="item-list">
                <div class="item-card" onclick="updatePH(14.0, 'naoh')">🔥 <span data-key="naoh">Сілті</span></div>
            </div>
        </div>
    </div>

    <div id="mass" class="container">
        <h2 data-key="mass-title">⚖️ Молярлық масса және құрам</h2>
        <input type="text" id="mIn" placeholder="H2O, C6H12O6..." oninput="calcM()">
        <div id="mRes" class="result">...</div>
    </div>

    <div id="rxn" class="container">
        <h2 data-key="rxn-title">🧪 Реакцияларды теңестіру мен талдау</h2>
        <input type="text" id="rIn" placeholder="CH4 + O2 = CO2 + H2O">
        <button class="btn-solve" onclick="runBal()" data-key="btn-solve">Теңестіру және талдау</button>
        <div id="rRes" class="result">...</div>
    </div>

    <div id="stoch" class="container">
        <h2 data-key="stoch-title">📐 Есептерді шығару</h2>
        <input type="text" id="sEq" placeholder="1NaOH + 1HCl = 1NaCl + 1H2O">
        <button class="btn-solve" onclick="prepS()">Талдау</button>
        <div id="sUI" style="display:none; margin-top:20px;">
            <table id="sTab" style="width:100%"></table>
            <button class="btn-solve" onclick="solveS()">Есептеу</button>
        </div>
        <div id="sRes"></div>
    </div>

    <div id="redox" class="container">
        <h2 data-key="redox-title">⚡ ТТБ</h2>
        <input type="text" id="oIn" placeholder="KMnO4 + HCl = ...">
        <button class="btn-solve" onclick="runO()">Анықтау</button>
        <div id="oRes" class="result">...</div>
    </div>

    <script>
        const PT = {"H":1.008,"He":4.003,"Li":6.941,"Be":9.012,"B":10.81,"C":12.01,"N":14.01,"O":16,"F":19,"Ne":20.18,"Na":22.99,"Mg":24.31,"Al":26.98,"Si":28.09,"P":30.97,"S":32.06,"Cl":35.45,"Ar":39.95,"K":39.1,"Ca":40.08,"Sc":44.96,"Ti":47.87,"V":50.94,"Cr":52,"Mn":54.94,"Fe":55.85,"Co":58.93,"Ni":58.69,"Cu":63.55,"Zn":65.38,"Ga":69.72,"Ge":72.63,"As":74.92,"Se":78.96,"Br":79.9,"Kr":83.8,"Rb":85.47,"Sr":87.62,"Y":88.91,"Zr":91.22,"Nb":92.91,"Mo":95.94,"Ag":107.87,"Ba":137.33,"Pt":195.08,"Au":196.97,"Hg":200.59,"Pb":207.2};
        const FIXED_SOX = {"K":1,"Na":1,"Li":1,"Ag":1,"Ba":2,"Ca":2,"Mg":2,"Zn":2,"Al":3,"F":-1,"O":-2,"H":1};

        let curLang = 'kk';
        const dict = {
            kk: {
                "nav-home":"Басты бет","nav-mass":"Масса және құрам","nav-rxn":"Реакциялар","nav-stoch":"Есептер","nav-redox":"ТТБ","nav-ph":"pH Орта",
                "h-welcome":"Химия әлеміне қош келдіңіз!","m-name":"Дмитрий Менделеев","p-title":"Кесте",
                "mass-title":"⚖️ Молярлық масса","rxn-title":"🧪 Реакцияларды теңестіру","stoch-title":"📐 Есептер шығару","ph-title":"🌈 pH Шкаласы",
                "redox-title":"⚡ ТТБ","btn-solve":"Орындау","lemon":"Лимон","water":"Су","naoh":"Сілті"
            },
            ru: {
                "nav-home":"Главная","nav-mass":"Масса и состав","nav-rxn":"Реакции","nav-stoch":"Задачи","nav-redox":"ОВР","nav-ph":"pH Среда",
                "h-welcome":"Добро пожаловать!","m-name":"Дмитрий Менделеев","p-title":"Таблица",
                "mass-title":"⚖️ Молярная масса","rxn-title":"🧪 Уравнивание реакций","stoch-title":"📐 Решение задач","ph-title":"🌈 Шкала pH",
                "redox-title":"⚡ ОВР","btn-solve":"Выполнить","lemon":"Лимон","water":"Вода","naoh":"Щелочь"
            }
        };

        function toggleLang() {
            curLang = curLang === 'kk' ? 'ru' : 'kk';
            document.querySelectorAll('[data-key]').forEach(el => el.innerText = dict[curLang][el.getAttribute('data-key')]);
        }

        function showPage(id, btn) {
            document.querySelectorAll('.container').forEach(c => { c.classList.remove('active-page'); c.style.display='none'; });
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).style.display='block';
            setTimeout(() => document.getElementById(id).classList.add('active-page'), 10);
            btn.classList.add('active');
        }

        // PH Logic (v1.1)
        function manualPH(val) {
            val = parseFloat(val);
            document.getElementById('ph-num').innerText = val.toFixed(1);
            document.getElementById('ind-lak').style.backgroundColor = val < 6 ? '#e74c3c' : (val > 8 ? '#3498db' : '#9b59b6');
            document.getElementById('ind-met').style.backgroundColor = val < 4 ? '#ff4d4d' : '#f1c40f';
            document.getElementById('ind-fen').style.backgroundColor = val < 9 ? '#bdc3c7' : '#e84393';
        }

        function updatePH(target) {
            document.getElementById('ph-slider').value = target;
            manualPH(target);
        }

        // Parsing logic (Enhanced for Organics)
        function parse(f) {
            let mult = (f.match(/^(\d+)/) || [1, 1])[1];
            let s = f.replace(/^\d+/, ''), i = 0;
            const p = () => {
                let d = {};
                while(i < s.length && s[i] !== ')') {
                    if(s[i] === '(') { i++; let n = p(); i++; let c = parseInt(s.slice(i).match(/^\d+/) || 1); 
                        for(let e in n) d[e] = (d[e]||0) + n[e]*c; i += (s.slice(i).match(/^\d+/) || [""])[0].length;
                    } else {
                        let m = s.slice(i).match(/^([A-Z][a-z]?)([0-9]*)/);
                        if(m) { d[m[1]] = (d[m[1]]||0) + parseInt(m[2] || 1); i += m[0].length; } else i++;
                    }
                } return d;
            };
            let res = p(); for(let e in res) res[e] *= mult; return res;
        }

        function getM(f) { let d = parse(f); return Object.entries(d).reduce((a, [e, c]) => a + (PT[e] || 0) * c, 0); }

        function calcM() {
            let v = document.getElementById('mIn').value.trim();
            if(!v) { document.getElementById('mRes').innerHTML = "..."; return; }
            try {
                let d = parse(v); let totalM = 0; let comps = [];
                for(let e in d) { let m = PT[e]*d[e]; totalM += m; comps.push({n:e, w:m}); }
                let h = `<b>Mr(${v}) = ${totalM.toFixed(3)}</b><br>`;
                comps.forEach(c => {
                    let p = (c.w/totalM*100).toFixed(2);
                    h += `<div class="comp-row"><div class="comp-label">${c.n}</div><div class="comp-bar-bg"><div class="comp-bar-fill" style="width:${p}%"></div></div><div>${p}% (${c.w.toFixed(2)}г)</div></div>`;
                });
                document.getElementById('mRes').innerHTML = h;
            } catch(e) { document.getElementById('mRes').innerHTML = "Error"; }
        }

        // BALANCING AND TYPE ANALYSIS (New 3-4 reagent logic)
        function runBal() {
            let inp = document.getElementById('rIn').value.replace(/\s+/g, '');
            if(!inp.includes('=')) return;
            let [l, r] = inp.split('=');
            let lhs = l.split('+'), rhs = r.split('+'), comps = [...lhs, ...rhs];
            
            // Balancing logic
            let els = Array.from(new Set(comps.flatMap(c => Object.keys(parse(c)))));
            let matrix = els.map(e => comps.map((c, j) => (parse(c)[e] || 0) * (j < lhs.length ? 1 : -1)));
            matrix.push(comps.map((_, j) => j === 0 ? 1 : 0));
            let b = new Array(els.length).fill(0); b.push(1);
            
            try {
                let x = math.lusolve(matrix, b).map(v => Math.abs(v[0]));
                let f = 1; while(!x.every(v => Math.abs(Math.round(v*f) - v*f) < 0.001) && f < 1000) f++;
                let res = x.map(v => Math.round(v*f));
                let oL = [], oR = [];
                res.forEach((c, i) => { let s = (c===1?'':c) + comps[i]; if(i < lhs.length) oL.push(s); else oR.push(s); });
                
                let balanced = `<b>${oL.join(' + ')} = ${oR.join(' + ')}</b>`;

                // --- TYPE ANALYSIS LOGIC ---
                let typeName = "";
                let typeDesc = "";
                let L = lhs.length, R = rhs.length;
                
                // Check for organic combustion
                let isOrganic = lhs.some(c => parse(c).C && parse(c).H);
                let hasOxygen = lhs.some(c => c === 'O2');

                if (isOrganic && hasOxygen && rhs.includes('CO2')) {
                    typeName = curLang === 'kk' ? "Жану реакциясы (Органика)" : "Реакция горения (Органическая)";
                    typeDesc = curLang === 'kk' ? "Органикалық зат оттегімен әрекеттесіп, көмірқышқыл газы мен су түзеді." : "Органическое вещество взаимодействует с кислородом, образуя углекислый газ и воду.";
                } else if (L >= 2 && R === 1) {
                    typeName = curLang === 'kk' ? "Қосылу реакциясы" : "Реакция соединения";
                    typeDesc = curLang === 'kk' ? "Бірнеше бастапқы заттардан бір күрделі өнім түзіледі." : "Из нескольких исходных веществ образуется один сложный продукт.";
                } else if (L === 1 && R >= 2) {
                    typeName = curLang === 'kk' ? "Айырылу реакциясы" : "Реакция разложения";
                    typeDesc = curLang === 'kk' ? "Бір күрделі зат бірнеше жай немесе күрделі заттарға ыдырайды." : "Одно сложное вещество распадается на несколько простых или сложных веществ.";
                } else if (L >= 2 && R >= 2) {
                    // Check if there are simple substances (Oryn basu vs Almasu)
                    let simpleL = lhs.filter(c => Object.keys(parse(c)).length === 1).length;
                    if (simpleL > 0) {
                        typeName = curLang === 'kk' ? "Орын басу реакциясы" : "Реакция замещения";
                        typeDesc = curLang === 'kk' ? "Жай зат күрделі заттың құрамындағы бір элемент атомын ығыстырып шығарады." : "Атомы простого вещества замещают атомы одного из элементов в сложном веществе.";
                    } else {
                        typeName = curLang === 'kk' ? "Алмасу реакциясы" : "Реакция обмена";
                        typeDesc = curLang === 'kk' ? "Екі күрделі зат құрамдас бөліктерімен алмасады." : "Два сложных вещества обмениваются своими составными частями.";
                    }
                } else {
                    typeName = curLang === 'kk' ? "Күрделі реакция" : "Сложная реакция";
                    typeDesc = curLang === 'kk' ? "Бұл реакция бірнеше сатыдан тұратын көп компонентті процесс." : "Эта реакция является многокомпонентным процессом, включающим несколько стадий.";
                }

                document.getElementById('rRes').innerHTML = `
                    <div style="margin-bottom:15px">${balanced}</div>
                    <div class="rxn-type-badge">${typeName}</div>
                    <div class="rxn-desc">${typeDesc}</div>
                `;
            } catch(e) { document.getElementById('rRes').innerHTML = "Қате: Формуланы немесе теңдеуді тексеріңіз"; }
        }

        // Stochiometry logic
        function prepS() {
            let comps = document.getElementById('sEq').value.split(/[=+]/).map(s => s.trim());
            document.getElementById('sTab').innerHTML = '<tr>' + comps.map(c => `<th>${c}</th>`).join('') + '</tr>' +
                '<tr>' + comps.map((_, i) => `<td><input id="v${i}" style="width:50px"><select id="t${i}"><option value="m">г</option><option value="V">л</option><option value="n">моль</option></select></td>`).join('') + '</tr>';
            document.getElementById('sUI').style.display = 'block';
        }

        function solveS() {
            let comps = document.getElementById('sEq').value.split(/[=+]/).map(s => s.trim());
            let coeffs = comps.map(c => parseInt(c.match(/^\d+/) || 1));
            let kI = -1; comps.forEach((_, i) => { if(document.getElementById('v'+i).value) kI = i; });
            let val = parseFloat(document.getElementById('v'+kI).value);
            let n1 = (document.getElementById('t'+kI).value === 'm' ? val/getM(comps[kI].replace(/^\d+/,'')) : val/22.4) / coeffs[kI];
            let h = "";
            comps.forEach((c, i) => {
                if(i !== kI) {
                    let res = (n1 * coeffs[i] * (document.getElementById('t'+i).value==='m' ? getM(c.replace(/^\d+/,'')) : 22.4)).toFixed(2);
                    h += `<div class="result">${c}: ${res}</div>`;
                }
            });
            document.getElementById('sRes').innerHTML = h;
        }

        function runO() {
            // Simplified redox analysis logic
            document.getElementById('oRes').innerHTML = "Анализ орындалуда...";
        }

        window.onload = () => manualPH(7);
    </script>
</body>
</html>

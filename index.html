<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemistry Pro: Total Control</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <style>
        :root { --bg-mass: #e0f2f1; --bg-rxn: #fff3e0; --bg-stoch: #f3e5f5; --bg-redox: #ffebee; --primary: #263238; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: var(--bg-mass); transition: 0.6s; display: flex; flex-direction: column; align-items: center; }
        nav { margin: 20px; display: flex; gap: 8px; padding: 10px; background: rgba(255,255,255,0.9); border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); position: sticky; top: 10px; z-index: 1000; }
        .nav-btn { border: none; padding: 10px 18px; border-radius: 20px; cursor: pointer; background: transparent; font-weight: 600; transition: 0.3s; }
        .nav-btn.active { background: var(--primary); color: white; }
        .container { display: none; width: 92%; max-width: 850px; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .active-page { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        input, select { padding: 12px; margin: 5px 0; border: 2px solid #eee; border-radius: 10px; font-size: 15px; outline: none; }
        .btn-solve { background: var(--primary); color: white; border: none; padding: 15px; width: 100%; border-radius: 12px; font-size: 17px; cursor: pointer; margin-top: 15px; }
        .result { margin-top: 15px; padding: 15px; background: #fcfcfc; border-radius: 10px; border-left: 5px solid var(--primary); line-height: 1.6; }
        .badge { padding: 3px 8px; border-radius: 5px; color: white; font-size: 0.85em; font-weight: bold; }
        .ox { background: #d32f2f; } .red { background: #1976d2; }
    </style>
</head>
<body id="mainBody">

    <nav>
        <button class="nav-btn active" onclick="showPage('mass', '--bg-mass', this)">⚖️ Масса</button>
        <button class="nav-btn" onclick="showPage('rxn', '--bg-rxn', this)">🧪 Реакции</button>
        <button class="nav-btn" onclick="showPage('stoch', '--bg-stoch', this)">📐 Задачи</button>
        <button class="nav-btn" onclick="showPage('redox', '--bg-redox', this)">⚡ ОВР</button>
    </nav>

    <div id="redox" class="container active-page">
        <h2>⚡ ОВР Анализ (Все элементы)</h2>
        <input type="text" id="redoxInput" placeholder="KMnO4 + HCl = KCl + MnCl2 + Cl2 + H2O" style="width: 95%;">
        <button class="btn-solve" onclick="solveRedox()">Найти окислитель и восстановитель</button>
        <div id="redoxRes" class="result">Введите уравнение и нажмите кнопку.</div>
    </div>

    <script>
        // ... (функции parseF, getM, showPage из прошлых ответов) ...

        const PT = {"H":1.008,"He":4.003,"Li":6.941,"Be":9.012,"B":10.81,"C":12.01,"N":14.01,"O":16.00,"F":19.00,"Ne":20.18,"Na":22.99,"Mg":24.31,"Al":26.98,"Si":28.09,"P":30.97,"S":32.06,"Cl":35.45,"Ar":39.95,"K":39.10,"Ca":40.08,"Sc":44.96,"Ti":47.87,"V":50.94,"Cr":52.00,"Mn":54.94,"Fe":55.85,"Co":58.93,"Ni":58.69,"Cu":63.55,"Zn":65.38,"Ga":69.72,"Ge":72.63,"As":74.92,"Se":78.96,"Br":79.90,"Kr":83.80,"Rb":85.47,"Sr":87.62,"Y":88.91,"Zr":91.22,"Nb":92.91,"Mo":95.94,"Tc":98,"Ru":101.07,"Rh":102.91,"Pd":106.42,"Ag":107.87,"Cd":112.41,"In":114.82,"Sn":118.71,"Sb":121.76,"Te":127.60,"I":126.90,"Xe":131.29,"Cs":132.91,"Ba":137.33,"La":138.91,"Ce":140.12,"Pr":140.91,"Nd":144.24,"Pm":145,"Sm":150.36,"Eu":151.96,"Gd":157.25,"Tb":158.93,"Dy":162.50,"Ho":164.93,"Er":167.26,"Tm":168.93,"Yb":173.04,"Lu":174.97,"Hf":178.49,"Ta":180.95,"W":183.84,"Re":186.21,"Os":190.23,"Ir":192.22,"Pt":195.08,"Au":196.97,"Hg":200.59,"Tl":204.38,"Pb":207.2,"Bi":208.98,"Po":209,"At":210,"Rn":222,"Fr":223,"Ra":226,"Ac":227,"Th":232.04,"Pa":231.04,"U":238.03,"Np":237,"Pu":244,"Am":243,"Cm":247,"Bk":247,"Cf":251,"Es":252,"Fm":257,"Md":258,"No":259,"Lr":262,"Rf":267,"Db":270,"Sg":271,"Bh":270,"Hs":277,"Mt":276,"Ds":281,"Rg":280,"Cn":285,"Nh":284,"Fl":289,"Mc":288,"Lv":293,"Ts":294,"Og":294};

        // БАЗА ЗНАНИЙ СТЕПЕНЕЙ ОКИСЛЕНИЯ
        const FIXED_SOX = {
            "K":1,"Na":1,"Li":1,"Rb":1,"Cs":1,"Ag":1,
            "Ba":2,"Ca":2,"Mg":2,"Sr":2,"Zn":2,
            "Al":3,"F":-1,"O":-2,"H":1
        };

        function getSox(comp) {
            const els = parseF(comp);
            const keys = Object.keys(els);
            if (keys.length === 1) return { [keys[0]]: 0 };

            let res = {};
            let unknown = [];
            let knownSum = 0;

            keys.forEach(k => {
                if (FIXED_SOX[k] !== undefined) {
                    res[k] = FIXED_SOX[k];
                    knownSum += FIXED_SOX[k] * els[k];
                } else {
                    unknown.push(k);
                }
            });

            // Если остался один неизвестный (например, Mn в KMnO4)
            if (unknown.length === 1) {
                res[unknown[0]] = -knownSum / els[unknown[0]];
            } 
            // Если неизвестных несколько, но есть типичные (например, Cl в солях)
            else if (unknown.length > 1) {
                // Если есть хлор в конце формулы без кислорода - это почти всегда -1
                if (unknown.includes("Cl") && !keys.includes("O")) {
                    res["Cl"] = -1;
                    knownSum += (-1) * els["Cl"];
                    let last = unknown.find(x => x !== "Cl");
                    if (last) res[last] = -knownSum / els[last];
                }
            }
            return res;
        }

        function solveRedox() {
            const eq = document.getElementById('redoxInput').value.replace(/\s+/g, '');
            const [l, r] = eq.split('=');
            
            let lStates = {}, rStates = {};
            
            l.split('+').forEach(c => {
                let m = getSox(c);
                for(let e in m) { if(!lStates[e]) lStates[e] = new Set(); lStates[e].add(Math.round(m[e])); }
            });
            r.split('+').forEach(c => {
                let m = getSox(c);
                for(let e in m) { if(!rStates[e]) rStates[e] = new Set(); rStates[e].add(Math.round(m[e])); }
            });

            let out = "";
            let elements = new Set([...Object.keys(lStates), ...Object.keys(rStates)]);

            elements.forEach(el => {
                if(lStates[el] && rStates[el]) {
                    lStates[el].forEach(s1 => {
                        rStates[el].forEach(s2 => {
                            if(s1 !== s2) {
                                let isOx = s1 > s2;
                                out += `<div style="margin-bottom:10px;"><b>${el}</b>: ${s1>0?'+':''}${s1} → ${s2>0?'+':''}${s2} | <span class="badge ${isOx?'ox':'red'}">${isOx?'Окислитель':'Восстановитель'}</span></div>`;
                            }
                        });
                    });
                }
            });
            document.getElementById('redoxRes').innerHTML = out || "Изменений не обнаружено.";
        }
        
        // ... (остальной скрипт) ...
    </script>
</body>
</html>
